<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APOYO-MAT · Materiales</title>
<style>
:root {
  --azul:#073763; --turquesa:#0794a5; --naranja:#f59a00;
  --fondo:#f4f8fb; --borde:#d7e3ec; --texto:#17324d; --muted:#62778a;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto)}
header{background:white;border-bottom:1px solid var(--borde);padding:10px 20px}
.header-inner{max-width:1180px;margin:auto;display:flex;align-items:center;gap:16px}
.brand{font-weight:900;font-size:clamp(24px,3vw,34px);color:var(--azul)}
.brand span{color:var(--turquesa)}
.sub{color:var(--muted);margin-top:3px}
main{max-width:1180px;margin:12px auto;padding:0 18px 14px}
.hero{display:flex;flex-direction:column;gap:12px}
.panel{background:white;border:1px solid var(--borde);border-radius:18px;box-shadow:0 6px 20px rgba(7,55,99,.07);overflow:hidden}.visual{order:-1;width:40%;margin:0 auto;background:white;border:1px solid var(--borde);border-radius:18px;box-shadow:0 6px 20px rgba(7,55,99,.07);overflow:hidden;display:flex;justify-content:center;align-items:center}
.panel{padding:14px 20px}
.visual img{width:100%;height:auto;display:block;object-fit:contain;object-position:center}
h1{font-size:clamp(22px,2.6vw,30px);margin:0 0 3px;color:var(--azul)}
.lead{margin:0 0 10px;color:var(--muted);line-height:1.35;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.field label{display:block;font-weight:800;margin:0 0 4px;color:var(--azul);font-size:14px}
select{width:100%;padding:9px 38px 9px 11px;border:1px solid #b9cbd9;border-radius:12px;background:#fff;font-size:16px;color:var(--texto)}
select:disabled{background:#eef3f6;color:#8a9aa7}
.status{margin-top:10px;padding:9px 13px;border-radius:10px;background:#eef5f8;border:1px solid var(--borde);min-height:40px;display:flex;align-items:center;font-size:14px}
.material-name{font-weight:700;margin-bottom:4px}.status.ok{background:#eefaf5;border-color:#9bd6bf;color:#176b4b}
.status.bad{background:#fff3f0;border-color:#efb5a8;color:#9a3826}
.status.wait{background:#fff9e9;border-color:#eed38a;color:#7a5b00}
.meta{margin-top:10px;color:var(--muted);font-size:14px}
.actions{display:flex;gap:10px;margin-top:9px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:850;cursor:pointer}
#openBtn{background:var(--turquesa);color:white}
#openBtn:disabled{background:#b7c6ce;cursor:not-allowed}#clearBtn:disabled{opacity:.45;cursor:not-allowed}
#clearBtn{background:white;color:var(--azul);border:1px solid #b9cbd9}
.note{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.3}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.visual{width:40%}.visual img{width:100%}}@media(max-width:560px){.grid{grid-template-columns:1fr}.panel{padding:18px}.visual{width:90%}.visual img{width:100%}} .panel{padding:18px}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div>
      <div class="brand">APOYO-<span>MAT</span></div>
      <div class="sub">Refuerzo matemático · 6.º Primaria · 1.º–4.º ESO</div>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <section class="panel">
      <h1>MATERIALES</h1>
      <div id="catalogStatus" class="status">Cargando catálogo de APOYO-MAT…</div>
      <div class="grid">
        <div class="field"><label for="curso">CURSO</label><select id="curso"><option value="">Selecciona curso…</option></select></div>
        <div class="field"><label for="bloque">BLOQUE</label><select id="bloque" disabled><option value="">Selecciona bloque…</option></select></div>
        <div class="field"><label for="apartado">APARTADO</label><select id="apartado" disabled><option value="">Selecciona apartado…</option></select></div>
        <div class="field"><label for="tipo">MATERIAL</label><select id="tipo" disabled><option value="">Selecciona material…</option></select></div>
      </div>
      <div id="selectionStatus" class="status" hidden></div>

      

      <div class="actions">
        <button id="openBtn" type="button" disabled>ABRIR</button>
        <button id="clearBtn" type="button">LIMPIAR</button>
      </div>

      </section>

    <aside class="visual"><img src="apoyo-mat.png" alt="APOYO-MAT · Refuerzo matemático"></aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
let CATALOGO = [];

const $ = id => document.getElementById(id);
const curso=$("curso"), bloque=$("bloque"), apartado=$("apartado"), tipo=$("tipo");
const catalogStatus=$("catalogStatus"), selectionStatus=$("selectionStatus"), openBtn=$("openBtn"), clearBtn=$("clearBtn");
openBtn.disabled=true; clearBtn.disabled=true;
let archivoActual = null;

function uniq(arr) { return [...new Set(arr)].sort((a,b)=>a.localeCompare(b,"es",{numeric:true})); }
function setOptions(sel, values, placeholder) {
  sel.innerHTML = `<option value="">${placeholder}</option>` + values.map(v=>`<option>${v}</option>`).join("");
  sel.disabled = values.length===0;
}
function subset() {
  return CATALOGO.filter(x =>
    (!curso.value || x.curso===curso.value) &&
    (!bloque.value || x.bloque===bloque.value) &&
    (!apartado.value || x.apartado===apartado.value) &&
    (!tipo.value || x.tipo===tipo.value)
  );
}
function resetResult() {
  archivoActual=null;
  openBtn.disabled=true;
  selectionStatus.hidden=true;
  selectionStatus.className="status";
  selectionStatus.textContent="";
}
function loadCursos() { setOptions(curso, uniq(CATALOGO.map(x=>x.curso)), "Selecciona curso…"); }

curso.addEventListener("change", () => {
  setOptions(bloque, uniq(subset().map(x=>x.bloque)), "Selecciona bloque…");
  setOptions(apartado, [], "Selecciona apartado…"); setOptions(tipo, [], "Selecciona material…"); resetResult();
});
bloque.addEventListener("change", () => {
  setOptions(apartado, uniq(subset().map(x=>x.apartado)), "Selecciona apartado…");
  setOptions(tipo, [], "Selecciona material…"); resetResult();
});
apartado.addEventListener("change", () => {
  setOptions(tipo, uniq(subset().map(x=>x.tipo)), "Selecciona material…"); resetResult();
});
tipo.addEventListener("change", comprobar);

async function comprobar() {
  resetResult();
  if(!curso.value || !bloque.value || !apartado.value || !tipo.value) return;
  const matches=subset();
  if(matches.length!==1) {
    selectionStatus.hidden=false;
    selectionStatus.className="status bad";
    selectionStatus.innerHTML = matches.length===0
      ? "No hay ningún material registrado con esta combinación."
      : "Hay más de un material registrado con esta combinación.";
    return;
  }
  const item=matches[0];
  const detalle = `${item.nombre}` + (item.preguntas ? ` · ${item.preguntas} preguntas` : "");
  selectionStatus.hidden=false;
  selectionStatus.className="status wait";
  selectionStatus.innerHTML = `<div><div class="material-name">${detalle}</div><div>Comprobando si el fichero existe en el servidor…</div></div>`;
  try {
    const url = new URL(item.archivo, window.location.href);
    const r = await fetch(url, {method:"HEAD", cache:"no-store"});
    if(r.ok) {
      archivoActual=url.href; openBtn.disabled=false;
      selectionStatus.className="status ok";
      selectionStatus.innerHTML = `<div><div class="material-name">${detalle}</div><div>Material disponible. Puedes abrirlo.</div></div>`;
    } else {
      selectionStatus.className="status bad";
      selectionStatus.innerHTML = `<div><div class="material-name">${detalle}</div><div>Este material está registrado, pero el fichero todavía no existe en el servidor.</div></div>`;
    }
  } catch(e) {
    selectionStatus.className="status bad";
    selectionStatus.innerHTML = `<div><div class="material-name">${detalle}</div><div>No se ha podido comprobar el fichero. Abre este índice desde el servidor de GitHub Pages.</div></div>`;
  }
}

openBtn.addEventListener("click", () => { if(archivoActual) window.location.href=archivoActual; });
clearBtn.addEventListener("click", () => {
  curso.value=""; setOptions(bloque, [], "Selecciona bloque…"); setOptions(apartado, [], "Selecciona apartado…"); setOptions(tipo, [], "Selecciona material…"); resetResult();
});


function mostrarResumenCatalogo() {
  const conteo = {};
  CATALOGO.forEach(x => {
    const t = x.tipo || "OTROS";
    conteo[t] = (conteo[t] || 0) + 1;
  });
  const orden = ["FICHA","PRUEBA"];
  const tipos = [
    ...orden.filter(t => conteo[t] !== undefined),
    ...Object.keys(conteo).filter(t => !orden.includes(t)).sort((a,b)=>a.localeCompare(b,"es"))
  ];
  const partes = tipos.map(t => {
    const etiqueta = t === "FICHA" ? "FICHAS" :
                     t === "PRUEBA" ? "PRUEBAS" :
                     (conteo[t] === 1 ? t : t + "S");
    return `${conteo[t]} ${etiqueta}`;
  });
  catalogStatus.className = "status";
  catalogStatus.textContent = "Catálogo cargado: " + partes.join("    ·    ");
}

async function cargarCatalogoDesdeExcel() {
  const excel = "APOYO_MAT_LISTADO_FICHAS_PRUEBAS.xlsx";
  catalogStatus.className = "status wait";
  catalogStatus.textContent = "Cargando catálogo de APOYO-MAT…";
  try {
    const r = await fetch(excel, {cache:"no-store"});
    if (!r.ok) throw new Error("No se encuentra el Excel");
    const data = await r.arrayBuffer();
    const libro = XLSX.read(data, {type:"array"});
    const hoja = libro.Sheets[libro.SheetNames[0]];
    const filas = XLSX.utils.sheet_to_json(hoja, {defval:""});

    CATALOGO = filas
      .filter(f => f.CODIGO && f.CURSO && f.BLOQUE && f.APARTADO)
      .map(f => {
        const codigo = String(f.CODIGO).trim();
        const curso = String(f.CURSO).trim();
        const bloque = String(f.BLOQUE).trim();
        const apartado = String(f.APARTADO).trim();
        const tipo = String(f.MATERIAL || "").trim().toUpperCase();
        const nombreExcel = String(f.NOMBRE || "").trim();
        const nombre = nombreExcel || `${codigo} - ${curso} - ${bloque} - ${apartado}`;
        return {
          codigo, curso, bloque, apartado, tipo,
          preguntas: f["Nº PREGUNTAS"] || "",
          nombre,
          archivo: nombre + ".html"
        };
      })
      .filter(x => x.tipo);

    if (!CATALOGO.length) throw new Error("El Excel no contiene materiales válidos");
    clearBtn.disabled=false;
    loadCursos();
    mostrarResumenCatalogo();
  } catch (e) {
    curso.disabled = bloque.disabled = apartado.disabled = tipo.disabled = true;
    openBtn.disabled = true; clearBtn.disabled = true;
    catalogStatus.className = "status bad";
    catalogStatus.textContent = "No se ha podido cargar APOYO_MAT_LISTADO_FICHAS_PRUEBAS.xlsx desde el servidor.";
    catalogStatus.textContent += " Comprueba que el Excel está en la misma carpeta que index.html.";
  }
}
cargarCatalogoDesdeExcel();

</script>
</body>
</html>
